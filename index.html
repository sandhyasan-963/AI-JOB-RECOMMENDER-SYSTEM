<!DOCTYPE html>
<html>
<head>
    <title>AI Job Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body>

<h1>AI Job Recommender 🚀</h1>

<form method="POST">
    <label>Enter your skills (space separated):</label><br><br>
    <input type="text" name="skills" required>
    <br><br>
    <button type="submit">Recommend Jobs</button>
</form>

{% if recommendations %}
    <h2>Recommended Jobs:</h2>
    <ul>
        {% for item in recommendations %}
            <li>{{ item["job"] }} - Match: {{ item["score"] }}%</li>
        {% endfor %}
    </ul>
{% endif %}

</body>
</html>
